<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><!-- ★公開時に削除する -->
<title>bo-rro !［枕崎市網羅型ポータルサイト］</title>
<meta name="description" content="bo-rro !［枕崎市網羅型ポータルサイト］枕崎市の店・行政・求人をまとめて探せます。">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260829d">
</head>

<body class="home">
<div id="hd"></div>
<main class="sea">
  <div class="waves" aria-hidden="true">
    <span class="wave wave1"></span><span class="wave wave2"></span><span class="wave wave3"></span>
  </div>

  <header class="masthead">
    <p class="home-pill">どこから見る？</p>
    <h1 class="home-en">bo-rro !</h1>
    <p class="home-sub">枕崎市網羅型ポータルサイト</p>
  </header>

  <!-- 浮きはJSで差し込む。data.js の CATEGORIES を変えれば増減する -->
  <nav class="buoys" id="buoys" aria-label="カテゴリを選ぶ"></nav>

  <footer class="seabed">
    <p class="hint">
      <span class="hint-mark" aria-hidden="true">◠</span>
      気になるところを、ひとつ選んでください
    </p>
    <p class="credit">枕崎市 ／ 鹿児島県</p>
  </footer>

  <div class="flood" id="flood" aria-hidden="true"></div>
</main>
<div id="ft"></div>

<script src="data.js?v=20260829d"></script>
<script src="app.js?v=20260829d"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
/* ==========================================================================
   ホームの浮き
   --------------------------------------------------------------------------
   ・実体はリンク。JSが落ちても押せるし、キーボードでも辿れる
   ・動きを減らす設定なら物理演算を起動せず、CSSの並びのまま使う
   ========================================================================== */
mountHeader(null);
mountFooter();

const nav = document.getElementById("buoys");
const flood = document.getElementById("flood");

nav.innerHTML = CATEGORIES.map(c => `
  <a class="buoy${c.ready ? "" : " soon"}" href="${c.id}.html" style="--c:${c.color}">
    <span class="buoy-body">
      <span class="buoy-label">${c.label}</span>
      <span class="buoy-note">${c.note}</span>
      ${c.ready ? "" : '<span class="buoy-soon">準備中</span>'}
    </span>
  </a>`).join("");

const buoys = [...nav.querySelectorAll(".buoy")];
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* 選んだ色で画面が満ちてから移動する
   --------------------------------------------------------------------------
   ★2026/8/28 修正
   以前は click を待っていたが、スマホでは反応しないことがあった。理由は2つ。
     ① Matter.js が touchmove を preventDefault するため、click が出ないことがある
     ② 浮きは常に揺れているので、指を置いた瞬間に物体が動き、
        「掴んで投げた」と誤判定されてタップが握りつぶされていた
   → **物体ではなく指の動きを見る**ように変えた。
      指がほとんど動かず、短時間で離れたら「タップ」とみなす。 */
function goTo(el) {
  if (el.dataset.going === "1") return;
  el.dataset.going = "1";
  const r = el.getBoundingClientRect();
  flood.style.setProperty("--flood", getComputedStyle(el).getPropertyValue("--c").trim());
  flood.style.setProperty("--fx", `${r.left + r.width / 2}px`);
  flood.style.setProperty("--fy", `${r.top + r.height / 2}px`);
  flood.classList.add("on");
  setTimeout(() => { location.href = el.getAttribute("href"); }, reduced ? 60 : 520);
}

let press = null;
nav.addEventListener("pointerdown", e => {
  press = { x: e.clientX, y: e.clientY, t: Date.now() };
}, true);

nav.addEventListener("pointerup", e => {
  if (!press) return;
  const moved = Math.hypot(e.clientX - press.x, e.clientY - press.y);
  const quick = Date.now() - press.t < 700;
  press = null;
  if (moved > 12 || !quick) return;          // 投げた・長押しした → 遷移しない
  const el = e.target.closest(".buoy");
  if (el) goTo(el);
}, true);

nav.addEventListener("pointercancel", () => { press = null; }, true);

/* リンクの既定動作は常に止める。遷移は goTo が受け持つ。
   ただしキーボード操作（e.detail === 0）だけは、ここから遷移させる */
buoys.forEach(el => {
  el.addEventListener("click", e => {
    e.preventDefault();
    if (e.detail === 0) goTo(el);            // Enter / Space で選んだとき
  });
});

if (!reduced && window.Matter) startPhysics();

function startPhysics() {
  const { Engine, Runner, Bodies, Composite, Mouse, MouseConstraint, Body } = Matter;
  let W = nav.clientWidth, H = nav.clientHeight;
  if (W < 80 || H < 80) return;

  const engine = Engine.create();
  engine.gravity.x = 0; engine.gravity.y = 0;   // 沈ませない。海に浮かんでいる状態

  nav.style.display = "block";
  nav.style.minHeight = H + "px";

  const items = buoys.map((el, i) => {
    const r = el.offsetWidth / 2;
    const x = Math.min(Math.max((i + .5) / buoys.length * W, r + 4), W - r - 4);
    const y = H * (.32 + (i % 3) * .18);
    el.style.position = "absolute"; el.style.left = 0; el.style.top = 0; el.style.margin = 0;
    const body = Bodies.circle(x, y, r, {
      restitution: .74,    // 跳ね返り
      frictionAir: .048,   // 水の抵抗
      friction: .02, density: .0016,
    });
    body.__el = el;
    Composite.add(engine.world, body);
    return { el, body, r };
  });

  let walls = [];
  const buildWalls = () => {
    if (walls.length) Composite.remove(engine.world, walls);
    const t = 240;
    walls = [
      Bodies.rectangle(W/2, -t/2, W*3, t, { isStatic:true }),
      Bodies.rectangle(W/2, H+t/2, W*3, t, { isStatic:true }),
      Bodies.rectangle(-t/2, H/2, t, H*3, { isStatic:true }),
      Bodies.rectangle(W+t/2, H/2, t, H*3, { isStatic:true }),
    ];
    Composite.add(engine.world, walls);
  };
  buildWalls();

  const mouse = Mouse.create(nav);
  const mc = MouseConstraint.create(engine, { mouse, constraint:{ stiffness:.15, render:{ visible:false } } });
  Composite.add(engine.world, mc);
  if (mouse.mousewheel) mouse.element.removeEventListener("wheel", mouse.mousewheel);

  /* ★掴んだ判定は index 側の pointerdown / pointerup に移した（2026/8/28）
     物体の移動量で判定すると、揺れているだけでタップが握りつぶされる */

  Runner.run(Runner.create(), engine);

  /* 波のうねり */
  let t = 0;
  (function draw() {
    t += .006;
    items.forEach(({ el, body, r }, i) => {
      Body.applyForce(body, body.position, {
        x: Math.cos(t + i * 1.7) * .000045 * body.mass,
        y: Math.sin(t * 1.3 + i * .9) * .000055 * body.mass,
      });
      el.style.transform =
        `translate(${body.position.x - r}px, ${body.position.y - r}px) rotate(${body.angle * .35}rad)`;
    });
    requestAnimationFrame(draw);
  })();

  /* 画面サイズ・向きの変更に追従する（スマホのアドレスバーで必ず起きる） */
  let rt;
  const onResize = () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      W = nav.clientWidth; H = nav.clientHeight;
      if (W < 80 || H < 80) return;
      buildWalls();
      items.forEach(({ body, r }) => Body.setPosition(body, {
        x: Math.min(Math.max(body.position.x, r + 2), W - r - 2),
        y: Math.min(Math.max(body.position.y, r + 2), H - r - 2),
      }));
    }, 160);
  };
  addEventListener("resize", onResize, { passive:true });
  addEventListener("orientationchange", onResize);
}
</script>
</body>
</html>
